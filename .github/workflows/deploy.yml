# =====================================================================
#  Revisión de PHP en cada push a main.
#
#  El DESPLIEGUE no lo hace este workflow: lo hace la integración Git de
#  Hostinger (hPanel → Sitios web → mediagenda.com.mx → Despliegues), que
#  jala `main` sola. Aquí había un paso de subida por FTP que nunca tuvo
#  credenciales y fallaba en cada push; se quitó para no duplicar la subida.
#
#  Esta revisión corre en paralelo al despliegue de Hostinger, así que NO lo
#  frena: solo avisa (en rojo, en la pestaña Actions) si se coló un error de
#  sintaxis, para corregirlo de inmediato.
# =====================================================================
name: Revisar PHP

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions sin tener que
  # inventar un commit vacío.
  workflow_dispatch:

# Dos pushes seguidos: la segunda revisión espera a la primera.
concurrency:
  group: revisar-php
  cancel-in-progress: false

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Comprobar que el PHP no tenga errores de sintaxis
        # Barato y evita el peor accidente: publicar un archivo que rompe
        # el sitio entero por un punto y coma.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
          errores=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null 2>&1 || { echo "SINTAXIS: $f"; errores=1; }
          done < <(find . -name '*.php' -not -path './.git/*')
          [ "$errores" -eq 0 ] || { echo "Hay errores de sintaxis: corrígelos, Hostinger ya los publicó."; exit 1; }
          echo "PHP OK"
