<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión</title>
<style>
:root { --b: #0f8dbf; --ink: #0f1d2b; --mut: #5b6b7b; --bg: #f4f8fb; --card: #fff; }
@media (prefers-color-scheme: dark) { :root { --ink: #e6e8ec; --mut: #9aa0aa; --bg: #0c0d10; --card: #16181d; } }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
       background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.c { background: var(--card); border-radius: 20px; padding: 32px 26px; max-width: 380px; text-align: center; box-shadow: 0 12px 40px rgba(15,40,60,.12); }
.i { width: 64px; height: 64px; border-radius: 50%; background: rgba(15,141,191,.12); display: inline-flex; align-items: center; justify-content: center; }
h1 { font-size: 1.3rem; margin: 16px 0 8px; }
p { color: var(--mut); line-height: 1.5; margin: 0 0 20px; }
button { background: var(--b); color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 1rem; font-weight: 600; cursor: pointer; }
</style></head>
<body><div class="c">
    <span class="i"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0f8dbf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01M3 3l18 18"/></svg></span>
    <h1>Sin conexión a internet</h1>
    <p>Revisa tu wifi o tus datos. Tu información está segura en la nube; en cuanto vuelva la conexión, sigues donde te quedaste.</p>
    <button onclick="location.reload()">Reintentar</button>
</div></body></html>
